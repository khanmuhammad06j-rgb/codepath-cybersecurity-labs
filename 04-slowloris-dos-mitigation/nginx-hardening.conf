# nginx settings used to stop the Slowloris attack in this lab.
# Put the two zone lines in the http {} block and the rest in the server {} block.

# http {}
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_zone  $binary_remote_addr zone=reqs:10m rate=10r/s;

# server {}
limit_conn perip 10;               # max open connections per client IP
limit_req  zone=reqs burst=20;     # 10 requests/second, short bursts up to 20

client_header_timeout 5s;          # drop clients that send headers too slowly
client_body_timeout   5s;          # drop clients that send the body too slowly
keepalive_timeout     15s;         # free idle connections quickly
send_timeout          10s;
